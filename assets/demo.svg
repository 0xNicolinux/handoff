<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="t d">
<title id="t">/handoff demo</title>
<desc id="d">A terminal runs /handoff: it announces it is stopping, waits for a running review, checks repo state, makes a local WIP commit, writes and lints HANDOFF.md, and says nothing was pushed. Next morning, a fresh session shows the waiting handoff, checks the git state, reads what failed, and asks the first A/B question.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14.5px;white-space:pre}
.a1,.a2{opacity:0}
@keyframes l0{0%,1.500%{opacity:0;transform:translateY(3px)}2.600%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l0{animation:l0 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes m0{0%,2.250%{transform:translateX(0);animation-timing-function:steps(8,end)}4.050%{transform:translateX(85.9px);opacity:1}4.300%,100%{transform:translateX(85.9px);opacity:0}}
.m0{animation:m0 20s linear infinite}
@keyframes l1{0%,6.500%{opacity:0;transform:translateY(3px)}7.600%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l1{animation:l1 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l2{0%,12.500%{opacity:0;transform:translateY(3px)}13.600%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l2{animation:l2 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l3{0%,17.000%{opacity:0;transform:translateY(3px)}18.100%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l3{animation:l3 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l4{0%,21.500%{opacity:0;transform:translateY(3px)}22.600%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l4{animation:l4 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l5{0%,26.000%{opacity:0;transform:translateY(3px)}27.100%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l5{animation:l5 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l6{0%,32.000%{opacity:0;transform:translateY(3px)}33.100%,47.000%{opacity:1;transform:translateY(0)}48.750%,100%{opacity:0;transform:translateY(0)}}
.l6{animation:l6 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l7{0%,49.500%{opacity:0;transform:translateY(3px)}50.600%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
.l7{animation:l7 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l8{0%,52.000%{opacity:0;transform:translateY(3px)}53.100%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
.l8{animation:l8 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes m8{0%,52.750%{transform:translateX(0);animation-timing-function:steps(6,end)}54.500%{transform:translateX(67.9px);opacity:1}54.750%,100%{transform:translateX(67.9px);opacity:0}}
.m8{animation:m8 20s linear infinite}
@keyframes l9{0%,56.500%{opacity:0;transform:translateY(3px)}57.600%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
.l9{animation:l9 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l10{0%,61.000%{opacity:0;transform:translateY(3px)}62.100%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
.l10{animation:l10 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes m10{0%,61.750%{transform:translateX(0);animation-timing-function:steps(24,end)}67.150%{transform:translateX(229.8px);opacity:1}67.400%,100%{transform:translateX(229.8px);opacity:0}}
.m10{animation:m10 20s linear infinite}
@keyframes l11{0%,69.500%{opacity:0;transform:translateY(3px)}70.600%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
.l11{animation:l11 20s cubic-bezier(.23,1,.32,1) infinite}
@keyframes l12{0%,74.000%{opacity:0;transform:translateY(3px)}75.100%,96.500%{opacity:1;transform:translateY(0)}98.250%,100%{opacity:0;transform:translateY(0)}}
