</style>
<rect x="0.5" y="0.5" width="959" height="315" rx="16" fill="#131914" stroke="#28302a"/>
<path d="M16.5 0.5H943.5A16 16 0 0 1 959.5 16.5V44.5H0.5V16.5A16 16 0 0 1 16.5 0.5Z" fill="#0b100c"/>
<line x1="0.5" y1="44.5" x2="959.5" y2="44.5" stroke="#28302a"/>
<circle cx="24" cy="22.5" r="5.5" fill="#28302a"/><circle cx="43" cy="22.5" r="5.5" fill="#28302a"/><circle cx="62" cy="22.5" r="5.5" fill="#28302a"/>
<text x="480" y="27" text-anchor="middle" fill="#6f7770" style="font-size:13px">claude · ~/code/ledgerline</text>
  <g class="a1 l0"><text x="34" y="92" xml:space="preserve"><tspan fill="#6f7770">&gt; </tspan><tspan fill="#edf2ed">/handoff</tspan></text><rect class="mask m0" x="50.0" y="77" width="86" height="23" fill="#131914"/></g>
  <g class="a1 l1"><text x="34" y="119" xml:space="preserve"><tspan fill="#edf2ed">Stopping with /handoff. Running: review round 2 (~3 min). Starting nothing new.</tspan></text></g>
  <g class="a1 l2"><text x="34" y="146" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">waited for the review    </tspan><tspan fill="#6f7770">4 findings tabulated, 0 fixed</tspan></text></g>
  <g class="a1 l3"><text x="34" y="173" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">repo-state               </tspan><tspan fill="#6f7770">fix/webhook-idempotency @ 9f3c2a1 · no secrets</tspan></text></g>
  <g class="a1 l4"><text x="34" y="200" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">local commit             </tspan><tspan fill="#6f7770">a41d7e0  WIP: e2e isolation per worker</tspan></text></g>
  <g class="a1 l5"><text x="34" y="227" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">HANDOFF.md               </tspan><tspan fill="#6f7770">5 sections · check-handoff: OK</tspan></text></g>
  <g class="a1 l6"><text x="34" y="254" xml:space="preserve"><tspan fill="#a5ada6">Nothing pushed or deployed. Next session, say: </tspan><tspan fill="#65e287">continue from HANDOFF.md</tspan></text></g>
  <g class="a2 l7"><line x1="34" y1="87" x2="350" y2="87" stroke="#28302a"/><text x="480" y="92" text-anchor="middle"><tspan fill="#6f7770">next morning, fresh session</tspan></text><line x1="610" y1="87" x2="926" y2="87" stroke="#28302a"/></g>
  <g class="a2 l8"><text x="34" y="119" xml:space="preserve"><tspan fill="#6f7770">$ </tspan><tspan fill="#edf2ed">claude</tspan></text><rect class="mask m8" x="50.0" y="104" width="68" height="23" fill="#131914"/></g>
  <g class="a2 l9"><text x="34" y="146" xml:space="preserve"><tspan fill="#a5ada6">  Handoff waiting: ledgerline: idempotent payment webhook (STOPPED AT USAGE LIMIT, 9 h ago)</tspan></text></g>
  <g class="a2 l10"><text x="34" y="173" xml:space="preserve"><tspan fill="#6f7770">&gt; </tspan><tspan fill="#edf2ed">continue from HANDOFF.md</tspan></text><rect class="mask m10" x="50.0" y="158" width="230" height="23" fill="#131914"/></g>
  <g class="a2 l11"><text x="34" y="200" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">HEAD a41d7e0 matches section 2 · tree clean</tspan></text></g>
  <g class="a2 l12"><text x="34" y="227" xml:space="preserve"><tspan fill="#65e287">  ✓ </tspan><tspan fill="#edf2ed">read section 4: retry only 429/5xx; the limit is 60 s, not 10 s</tspan></text></g>
  <g class="a2 l13"><text x="34" y="254" xml:space="preserve"><tspan fill="#65e287">  → </tspan><tspan fill="#edf2ed">step 1 of 5: fix F1 and F2 now, or log them as known issues? (A/B)</tspan></text></g>
</svg>
