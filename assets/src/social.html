<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>handoff social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=block" rel="stylesheet">
<style>
  /* 1280x640 GitHub social preview (Settings → Social preview). Same system as banner.html. */
  :root {
    --bg: oklch(0.165 0.012 150);
    --surface: oklch(0.205 0.014 150);
    --line: oklch(0.30 0.016 150);
    --ink: oklch(0.955 0.008 150);
    --muted: oklch(0.74 0.014 150);
    --dim: oklch(0.56 0.014 150);
    --signal: oklch(0.82 0.17 150);
    --signal-tint: oklch(0.82 0.17 150 / 0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; background: var(--bg); color: var(--ink); font-family: "Geist", system-ui, sans-serif; overflow: hidden; }
  .wrap { position: relative; height: 100%; display: grid; grid-template-columns: 1fr 470px; gap: 56px; padding: 76px 80px 0; }
  .mark { font-family: "Geist Mono", monospace; font-weight: 600; font-size: 30px; }
  .mark b { color: var(--signal); font-weight: 600; }
  h1 { margin-top: 48px; font-weight: 600; font-size: 80px; line-height: 1.02; letter-spacing: -0.04em; white-space: nowrap; }
  .sub { margin-top: 30px; font-size: 25px; line-height: 1.42; color: var(--muted); max-width: 26ch; }
  .doc { align-self: start; margin-top: 8px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); font-family: "Geist Mono", monospace; overflow: hidden; }
  .doc header { padding: 20px 24px 18px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 18px; }
  .row { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: baseline; padding: 17px 24px; }
  .row + .row { border-top: 1px solid oklch(0.30 0.016 150 / 0.55); }
  .row .n { color: var(--dim); font-size: 17px; }
  .row .t { font-family: "Geist", sans-serif; font-weight: 500; font-size: 21px; letter-spacing: -0.01em; }
  .row.hot { background: var(--signal-tint); }
  .row.hot .n, .row.hot .t { color: var(--signal); }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-family: "Geist Mono", monospace; font-size: 17px; color: var(--dim); }
  .foot .rail { flex: 1; height: 1px; background: var(--line); margin: 0 22px; position: relative; }
  .foot .zone { position: absolute; left: 44%; width: 12%; top: -1px; height: 3px; background: var(--signal); border-radius: 2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="mark"><b>/</b>handoff</div>
      <h1>Stop mid-task.<br>Lose nothing.</h1>
      <p class="sub">A Claude Code skill that ends a session like a senior engineer would.</p>
    </div>
    <div class="doc">
      <header>HANDOFF.md</header>
      <div class="row"><span class="n">1</span><span class="t">Goal</span></div>
      <div class="row"><span class="n">2</span><span class="t">Where everything ended</span></div>
      <div class="row"><span class="n">3</span><span class="t">What changed</span></div>
      <div class="row hot"><span class="n">4</span><span class="t">What we tried that failed</span></div>
      <div class="row"><span class="n">5</span><span class="t">Exact next steps</span></div>
    </div>
    <div class="foot"><span>github.com/asalazarvaldiviaocg/handoff</span><span class="rail"><span class="zone"></span></span><span>MIT · zero deps</span></div>
  </div>
</body>
</html>
